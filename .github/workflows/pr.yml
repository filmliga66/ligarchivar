name: PR Validation

on:
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger "console;verbosity=normal"

  frontend:
    name: Frontend (lint + type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: src/frontend/.nvmrc
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  docker-smoke:
    name: Docker (build + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag ligarchivar:pr .

      - name: Check container startup
        run: |
          container=$(docker run --detach -e AUTH_USERNAME=smoke -e AUTH_PASSWORD=smoke ligarchivar:pr)
          trap 'docker rm -f "$container" >/dev/null' EXIT
          for attempt in {1..30}; do
            if docker exec "$container" curl --max-time 2 -fsS http://localhost:8080/health; then
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$container")" != true ]; then
              break
            fi
            sleep 1
          done
          docker logs "$container"
          exit 1
